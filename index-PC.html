<!DOCTYPE html>
<html>
    <head>
        <link rel="icon" type="image/x-icon" href="images/favicon.ico">
        <style>
            body{
                margin: 0;
                padding: 0;
                overflow: hidden;
                cursor: url("images/favicon_64x64.png"), auto;
                background-color: white;
            }

            #test {
                background-color: none;
                position: absolute;
                top: 3%;
                left: 50%;
                transform: translateX(-50%);
                width: 50%;
                height: 20%;
                z-index: 100;
            }

            #whiteCard {
                background-color: white;
                z-index: 200;
                width: 100%;
                height: 100%;
                top: 0;
                left: 0;
                position: absolute;
                display: none;
                opacity: 0;
                transition: opacity 800ms ease;
            }

            @keyframes orbit {
                from {  -webkit-transform: rotate(0deg) translateX(20px) rotate(0deg); }
                to   {  -webkit-transform: rotate(360deg) translateX(20px) rotate(-360deg); }
            }

            @keyframes Cpulse {
                0% { filter: hue-rotate(0deg); }
                50%   {  filter: hue-rotate(360deg); }
                100% {  filter: hue-rotate(0deg); }
        }  

            .stretch {
                height: auto;
                width: 100%;
            }
           
            #box {
                position: absolute;
                background-color: none;
                left: 50%;
                transform: translateX(-50%);
                width: 500px;
                height: 780px;
                z-index: 10;
                animation: Cpulse 2s backwards infinite;
                animation-timing-function: linear;
            }

            #slider {
                position: absolute;
                height: 9%;
                background-color: none;
                width: 450px;
                left: 50%;
                transform: translateX(-50%);
                top: 654px;
                z-index: 13;
            }

            #text {
                position: relative;
                background-color: none;
                height: 80px;
                left: 0px;
                top: 50%;
                transform: translateY(-50%);
                margin: 0;
                z-index: 14;
                animation: Cpulse 2s backwards infinite;
                animation-timing-function: linear;
            }

            #strawberry {
                position: absolute;
                height: 100%;
                transform: translateY(-50%);
                margin: 0;
                left: 2%;
                top: 50%;
                z-index: 15;
                touch-action: none;
                animation: Cpulse 2s backwards infinite;
                animation-timing-function: linear;
            }

            #bg{
                position: absolute;
                height: 100%;
                z-index: 1;
                animation: Cpulse 2s backwards infinite;
                animation-timing-function: linear;
            }

            #apps {
                position: absolute;
                height: 800px;
                left: 500px;
                z-index: 2;
                animation: orbit 2s backwards infinite, Cpulse 2s backwards infinite ;
                animation-timing-function: linear;
            }

            #mouth {
                position: absolute;
                width: 750px;
                top: -80px;
                left: 350px;
                z-index: 3;
                animation: orbit 5s infinite, Cpulse 2s backwards infinite;
                animation-timing-function: linear;
            }

            #time {
                position: absolute;
                width: 700px;
                top: -4%;
                left: 50%;
                transform: translateX(-50%);
                z-index: 7;
                animation: Cpulse 2s backwards infinite;
                animation-timing-function: linear;
            }

            #banana {
                position: absolute;
                left: 350px;
                top: -20px;
                height: 800px;
                z-index: 6;
                animation: orbit 1s infinite, Cpulse 2s forwards infinite;
                animation-timing-function: linear;
            }

            #supernova {
                position: absolute;
                height: 100%;
                z-index: 5;
            }

        </style>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body> 
        <div id="whiteCard"></div>
        <div id="test"></div>
        <img src="images/text_home_icon.png" id="time" class="stretch">
        <div id="strawBox">
            <div id="slider">
            <img src="images/slideText_home_icon.png" id="text" class="stretch">
            <img src="images/strawberry_home_icon.png" id="strawberry">
            </div>
            <img src="images/boxslider_home_icon.png" id="box">
        </div>
        <div id="bananaHome">
            <img src="images/banana_home_icon.png" id="banana">
            <img src="images/supernova_home_icon.png" id="supernova" class="stretch">
        </div>
        <img src="images/mouth_home_icon.png" id="mouth">
        <img src="images/home_icon_bg.png" id="apps">
        <img src="images/home_bg.png" id="bg" class="stretch">

<script>
const strawberry = document.getElementById("strawberry");
const slider = document.getElementById("slider");
const text = document.getElementById("text");

let dragging = false;

strawberry.addEventListener("pointerdown", () => dragging = true);
document.addEventListener("pointerup", () => dragging = false);

document.addEventListener("pointermove", (e) => {
    if (!dragging) return;

    const sliderRect = slider.getBoundingClientRect();
    const berryRect = strawberry.getBoundingClientRect();

    let x = e.clientX - sliderRect.left - berryRect.width / 2;

    const min = 0;
    const max = sliderRect.width - berryRect.width;

    x = Math.max(min, Math.min(x, max));

    strawberry.style.left = x + "px";

    let progress = x / max;

    text.style.opacity = 1 - progress;

    if (progress >= 0.98) {
    const whiteCard = document.getElementById("whiteCard");

    whiteCard.style.display = "block";
    
    // Allow the browser to render display:block before starting the fade
    requestAnimationFrame(() => {
        whiteCard.style.opacity = "1";
    });

    // Navigate after the fade finishes
    setTimeout(() => {
        window.location.href = "page2_PC.html";
    }, 800);
}

});
</script>
    </body>
</html>
