<!DOCTYPE html>
<html>
    <head>
        <style>
            body {
                margin: 0;
                padding: 0;
                overflow: hidden;
            }

            .stretch {
                height: 100%;
                width: 100%;
            }

            #bg{
                position: absolute;
                top: 0%;
                width: 100%;
                z-index: 2;
            }

            #baby {
                position: absolute;
                width: 30%;
                top: 15%;
                left: 60%;
                z-index: 10;
                animation: orbit 2s backwards infinite;
                animation-timing-function: linear;
            }


            #countdown {
                font-size: 5em;
                 display: inline-block;
            }
            
             #idlePopup {
    display: none;
    position: fixed;
    z-index: 100000;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(0,0,0,0.6);
    justify-content: center;
    align-items: center;
}

#idlePopup.active {
    display: flex;
}

#idleBox {
    background-image: linear-gradient(to bottom, red, yellow);
    padding: 30px;
    border-radius: 20px;
    text-align: center;
}

#idleTitle {
    font-family: Arial, Helvetica, sans-serif;
    color: white;
    font-size: 4vw;
    text-shadow:
        0 0 5px blue,
        0 0 10px blue,
        0 0 20px blue,
        0 0 40px blue;
}

            #back {
                z-index: 20;
                width: 12%;
                height: auto;
                position: absolute;
                left: 10%;
                top: 75%;
            }

            #message {
                position: absolute;
                top: 0%;
                left: 0%;
                z-index: 4;
                width: 100%;
                height: auto;
                opacity: 1;
                animation: fade 2s linear forwards;
                -webkit-animation: fade 2s linear forwards;
            }

            @keyframes fade {
                from {opacity: 0;}
                to {opacity: 1;}
            }

            @keyframes orbit {
                from {  -webkit-transform: rotate(0deg) translateX(20px) rotate(0deg); }
                to   {  -webkit-transform: rotate(360deg) translateX(20px) rotate(-360deg); }
            }
        </style>
    </head>
    <body>
        <img id="message">
        <a href="page2_iPad.html">
            <img src="images/dressUp_back.png" id="back" class="stretch">
        </a> 
        <img src="images/youSaidNo2_baby.png" id="baby">
        <img src="images/youSaidNo2.jpg" id="bg" class="stretch">
        <div id="idlePopup">
    <div id="idleBox">
        <h1 id="idleTitle">Press anywhere <br>to continue<br><span id="countdown">5</span></h1>
    </div>
</div>
<audio id="burpSound" preload="auto" playsinline>
    <source src="burp.m4a" type="audio/mp4">
</audio>
    <script>
    const options = [
        "images/youSaidNo2_op1.png",
        "images/youSaidNo2_op2.png",
        "images/youSaidNo2_op3.png"
    ];

    const randomImage = options[Math.floor(Math.random() * options.length)];

    document.getElementById("message").src = randomImage;

     let idleTimer;
let countdownTimer;
let countdownValue = 5;

const popup = document.getElementById("idlePopup");
const countdownEl = document.getElementById("countdown");

// Reset everything on activity
function resetIdle() {
    clearTimeout(idleTimer);
    clearInterval(countdownTimer);
    popup.classList.remove("active");
    countdownValue = 10;
    countdownEl.textContent = countdownValue;

    idleTimer = setTimeout(startCountdown, 10000); // 10 seconds idle
}

// Start countdown popup
function startCountdown() {
    popup.classList.add("active");

    countdownTimer = setInterval(() => {
        countdownValue--;
        countdownEl.textContent = countdownValue;

        if (countdownValue <= 0) {
            clearInterval(countdownTimer);
            window.location.href = "unlock.html";
        }
    }, 1000);
}

// Listen for ANY pointer activity
["pointermove", "pointerdown", "touchstart", "click"].forEach(event => {
    document.addEventListener(event, resetIdle);
});

// Initialize
resetIdle();

document.addEventListener("pointerdown", () => {

    const burp = new Audio("burp.m4a");

    burp.playsInline = true;
    burp.volume = 1;

    burp.play().catch(err => {
        console.log(err);
    });

});
</script>

    </body>
</html>
