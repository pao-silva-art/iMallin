<!DOCTYPE html>
<html>
    <head>
        <style>
            body{
                margin: 0;
                padding: 0;
                overflow: hidden;
            }

            #fortune {
                position: absolute;
                top: 15%;
                left: 20%;
                width: 30%;
                z-index: 14;
                cursor: pointer;
                animation: orbit 2s backwards infinite;
                animation-timing-function: linear;
            }

            #desktopBlock {
                display: none;
                position: fixed;
                z-index: 9999;
                top: 0;
                left: 0;
                width: 100vw;
                height: 100vh;
                background: black;
                color: white;
                font-size: 2rem;
                text-align: center;
                justify-content: center;
                align-items: center;
            }

           /* When desktop detected */
            body.desktop #desktopBlock {
              display: flex;
            }

                /* Hide everything else */
                body.desktop *:not(#desktopBlock) {
              display: none !important;
                }

            @keyframes orbit {
                from {  -webkit-transform: rotate(0deg) translateX(20px) rotate(0deg); }
                to   {  -webkit-transform: rotate(360deg) translateX(20px) rotate(-360deg); }
            }

            .stretch {
                height: auto;
                width: 100%;
            }

            #bg{
                position: absolute;
                height: 100%;
                z-index: 1;
            }

            #divider {
                position: absolute;
                width: 100%;
                height: 100%;
                z-index: 4;
            }

            #idlePopup {
    display: none;
    position: fixed;
    z-index: 100000;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(0,0,0,0.6);
    justify-content: center;
    align-items: center;
}

#idlePopup.active {
    display: flex;
}

#idleBox {
    background-image: linear-gradient(to bottom, red, yellow);
    padding: 30px;
    border-radius: 20px;
    text-align: center;
}

#idleTitle {
    font-family: Arial, Helvetica, sans-serif;
    color: white;
    font-size: 4vw;
    text-shadow:
        0 0 5px blue,
        0 0 10px blue,
        0 0 20px blue,
        0 0 40px blue;
}

            #suggestOverlay {
    display: none;
    position: fixed;
    z-index: 99999;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(0,0,0,0.7);
    justify-content: center;
    align-items: center;
}

#suggestOverlay.active {
    display: flex;
}

#suggestBox {
    width: 80%;
    max-width: 80%;
    background-image: linear-gradient(to bottom, red, yellow);
    padding: 20px;
    border-radius: 10px;
    text-align: center;
}

#suggestText {
    width: 90%;
    font-family: Arial, Helvetica, sans-serif;
    color: aliceblue;
    text-shadow: 0px 0px 2dvh blue, 0px 0px 1dvh blue, 0px 0px 7dvh blue;
    font-size: 5vW;
    border: none;
    margin-bottom: 10px;
}

#suggestActions button {
   font-family: Arial, Helvetica, sans-serif;
    color: aliceblue;
    font-size: 2vw;
    text-shadow: 0px 0px 2dvh blue, 0px 0px 1dvh blue, 0px 0px 7dvh blue;
    height: 5dvh;
    margin: 5px;
    padding: 10px;
    border-radius: 5px;
    border: NONE;
    cursor: pointer;
}

        </style>
    </head>

</div>

    <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
     <script>
    (function(){
    emailjs.init("r5fGUVRdcRUG5ROJG");
})();
    
            const toggle = document.getElementById("toggle");
            const container = document.getElementById("controlContainer");

                toggle.addEventListener("click", () => {
             container.classList.toggle("shifted");
        });

        const translateBtn = document.getElementById("translateBUTTON");
const fortuneImg = document.getElementById("fortune");

translateBtn.addEventListener("click", () => {
    if (fortuneImg.src.includes("ESP")) {
        fortuneImg.src = "images/page2_fortuneAD.png";
    } else {
        fortuneImg.src = "images/page2_fortuneAD-ESP.png";
    }
});

const suggestBtn = document.getElementById("suggestBUTTON");
const overlay = document.getElementById("suggestOverlay");
const closeBtn = document.getElementById("closeSuggest");
const submitBtn = document.getElementById("submitSuggest");
const textArea = document.getElementById("suggestText");

// Open popup
suggestBtn.addEventListener("click", () => {
    overlay.classList.add("active");
});

// Close popup
closeBtn.addEventListener("click", () => {
    overlay.classList.remove("active");
});

submitBtn.addEventListener("click", () => {
    const message = textArea.value;

    emailjs.send("service_dt37n1f", "template_8cpvrgh", {
        message: message
    }).then(() => {
        alert("Suggestion sent!");
        overlay.classList.remove("active");
        textArea.value = "";
    }, (error) => {
        alert("Failed to send. Try again.");
        console.error(error);
    });
});

        /* function isMobile() {
            return /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent)
          || window.innerWidth <= 768;
        }

            if (!isMobile()) {
              document.body.classList.add("desktop");
            } */
    let idleTimer;
let countdownTimer;
let countdownValue = 5;

const popup = document.getElementById("idlePopup");
const countdownEl = document.getElementById("countdown");

// Reset everything on activity
function resetIdle() {
    clearTimeout(idleTimer);
    clearInterval(countdownTimer);
    popup.classList.remove("active");
    countdownValue = 10;
    countdownEl.textContent = countdownValue;

    idleTimer = setTimeout(startCountdown, 10000); // 10 seconds idle
}

// Start countdown popup
function startCountdown() {
    popup.classList.add("active");

    countdownTimer = setInterval(() => {
        countdownValue--;
        countdownEl.textContent = countdownValue;

        if (countdownValue <= 0) {
            clearInterval(countdownTimer);
            window.location.href = "unlock.html";
        }
    }, 1000);
}

// Listen for ANY pointer activity
["pointermove", "pointerdown", "touchstart", "click"].forEach(event => {
    document.addEventListener(event, resetIdle);
});

// Initialize
resetIdle();
        </script>
