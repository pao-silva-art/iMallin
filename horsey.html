<body>

    <a href="page2.html">
            <img src="images/dressUp_back.png" id="back" class="stretch">
        </a> 

    <div id="scoreboard">
        Correct: <span id="score">0</span>/4
    </div>

    <div id="foodContainer">

        <div id="op1"></div>
        <div id="op2"></div>
        <div id="op3"></div>
        <div id="op4"></div>
        <div id="op5"></div>
        <div id="op6"></div>
        <div id="op7"></div>
        <div id="op8"></div>

        <img src="images/horsey_food.png" id="food">

    </div>

    <img src="images/horsey_op1.png" id="choice">
    <img src="images/horsey_BG.png" id="bg" class="stretch">

    <!-- AUDIO -->
    <audio id="burp" src="audio/burp.m4a"></audio>
    <audio id="boo" src="audio/boo.m4a"></audio>

    <!-- POPUP -->
    <!-- GAME POPUP -->

<div id="gamePopup">

    <div id="gameBox">

        <div id="gameText"></div>

        <button id="gameButton" onclick="restartGame()">
            play again
        </button>

    </div>

</div>

 <div id="idlePopup">
            <div id="idleBox">
                <h1 id="idleTitle">Press anywhere <br>to continue<br><span id="countdown">5</span></h1>
            </div>
        </div>
        <audio id="burpSound" preload="auto" playsinline>
            <source src="burp.m4a" type="audio/mp4">
        </audio>

    <script>

        const choice = document.getElementById("choice");

        const burp = document.getElementById("burp");
        const boo = document.getElementById("boo");

        const scoreDisplay = document.getElementById("score");

        let currentCorrect = 1;

        let score = 0;

        let roundTimeout;

        let gameActive = true;

        let gameStartTime = Date.now();

        // ----------------------------
        // SHOW RANDOM IMAGE
        // ----------------------------

        function showRandomImage(){

            if(!gameActive) return;

            currentCorrect = Math.floor(Math.random() * 8) + 1;

            choice.src = `images/horsey_op${currentCorrect}.png`;

            clearTimeout(roundTimeout);

            // player has 2 seconds
            roundTimeout = setTimeout(() => {

                playBoo();

                nextRound();

            }, 2000);
        }

        // ----------------------------
        // NEXT ROUND
        // ----------------------------

        function nextRound(){

            if(!gameActive) return;

            const elapsed = Date.now() - gameStartTime;

            // must get 4 correct within 3 seconds
            if(elapsed >= 3000){

                loseGame();
                return;
            }

            showRandomImage();
        }

        // ----------------------------
        // CLICK HANDLING
        // ----------------------------

        for(let i = 1; i <= 8; i++){

            document.getElementById(`op${i}`).addEventListener("click", () => {

                if(!gameActive) return;

                // CORRECT
                if(i === currentCorrect){

                    clearTimeout(roundTimeout);

                    score++;

                    scoreDisplay.innerText = score;

                    playBurp();

                    if(score >= 4){

                        winGame();
                        return;
                    }

                    nextRound();

                }

                // INCORRECT
                else{

                    playBoo();
                }

            });

        }

        // ----------------------------
        // AUDIO
        // ----------------------------

        function playBurp(){

            burp.currentTime = 0;
            burp.play();
        }

        function playBoo(){

            boo.currentTime = 0;
            boo.play();
        }

        // ----------------------------
        // WIN
        // ----------------------------

       function winGame(){

    gameActive = false;

    clearTimeout(roundTimeout);

    document.getElementById("gameText").innerHTML = `
        you've unlocked 1 free print.<br><br>

        to receive it, find me, and say:<br><br>

        <strong>"I am horsin' around."</strong>
    `;

    document.getElementById("gamePopup").classList.add("active");
}

function loseGame(){

    gameActive = false;

    clearTimeout(roundTimeout);

    document.getElementById("gameText").innerHTML = `
        too slow.<br><br>
        try again.
    `;

    document.getElementById("gamePopup").classList.add("active");
}
        // ----------------------------
        // RESTART
        // ----------------------------

        function restartGame(){

    document.getElementById("gamePopup").classList.remove("active");

    score = 0;

    scoreDisplay.innerText = score;

    gameActive = true;

    gameStartTime = Date.now();

    showRandomImage();
}


let idleTimer;
let countdownTimer;
let countdownValue = 5;

const popup = document.getElementById("idlePopup");
const countdownEl = document.getElementById("countdown");

// Reset everything on activity
function resetIdle() {
    clearTimeout(idleTimer);
    clearInterval(countdownTimer);
    popup.classList.remove("active");
    countdownValue = 10;
    countdownEl.textContent = countdownValue;

    idleTimer = setTimeout(startCountdown, 10000); // 10 seconds idle
}

// Start countdown popup
function startCountdown() {
    popup.classList.add("active");

    countdownTimer = setInterval(() => {
        countdownValue--;
        countdownEl.textContent = countdownValue;

        if (countdownValue <= 0) {
            clearInterval(countdownTimer);
            window.location.href = "index.html";
        }
    }, 1000);
}

// Listen for ANY pointer activity
["pointermove", "pointerdown", "touchstart", "click"].forEach(event => {
    document.addEventListener(event, resetIdle);
});

// Initialize
resetIdle();

document.addEventListener("pointerdown", () => {

    const burp = new Audio("burp.m4a");

    burp.playsInline = true;
    burp.volume = 1;

    burp.play().catch(err => {
        console.log(err);
    });

});
    </script>
