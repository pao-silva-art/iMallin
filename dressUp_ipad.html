<!DOCTYPE html>
<html>
    <head>
        <style>
            body {
                padding: 0;
                margin: 0;
                overflow: hidden;
            }

            #frame{
                z-index: 10;
                position: absolute;
                height: 100%;
                width: auto;
                left: 50%;
                transform: translateX(-50%);
            }
            
            #toolsImg{
                z-index: 11;
                position: absolute;
                height: 100%;
                width: auto;
                left: 48%;
                pointer-events: none;
            }

            #scissors {
                z-index: 12;
                position: absolute;
                background-color: none;
                width: 8%;
                height: 17%;
                left: 62%;
                top: 31%;
            }

            #spray {
                z-index: 12;
                position: absolute;
                background-color: none;
                width: 6%;
                height: 15%;
                left: 65%;
                top: 50%;
            }

            #brush {
                z-index: 12;
                position: absolute;
                background-color: none;
                width: 3%;
                height: 18%;
                left: 62%;
                top: 63%;
            }

            #dryer {
                z-index: 12;
                position: absolute;
                background-color: none;
                width: 7%;
                height: 15%;
                left: 52%;
                top: 78%;
            }

            #grass{
                z-index: 1;
                position: absolute;
                height: 100%;
                width: auto;
                left: 50%;
                transform: translateX(-50%);
            }

            #body {
                z-index: 3;
                position: absolute;
                height: 100%;
                width: auto;
                left: 50%;
                transform: translateX(-50%);
            }

            #clothing {
                z-index: 4;
                position: absolute;
                height: 100%;
                width: auto;
                left: 50%;
                transform: translateX(-50%);
            }

            #hair {
                z-index: 5;
                position: absolute;
                height: 100%;
                width: auto;
                left: 50%;
                transform: translateX(-50%);
            }

            #hat {
                z-index: 6;
                position: absolute;
                height: 100%;
                width: auto;
                left: 50%;
                transform: translateX(-50%);
            }

            #idlePopup {
                display: none;
                position: fixed;
                z-index: 100000;
                top: 0;
                left: 0;
                width: 100vw;
                height: 100vh;
                background: rgba(0,0,0,0.6);
                justify-content: center;
                align-items: center;
            }

            #idlePopup.active {
                display: flex;
            }

            #idleBox {
                background-image: linear-gradient(to bottom, red, yellow);
                padding: 30px;
                border-radius: 20px;
                text-align: center;
            }

            #idleTitle {
                font-family: Arial, Helvetica, sans-serif;
                color: white;
                font-size: 4vw;
                text-shadow:
                    0 0 5px blue,
                    0 0 10px blue,
                    0 0 20px blue,
                    0 0 40px blue;
            }

            #countdown {
                font-size: 5em;
                display: inline-block;
            }

        </style>
    </head>
    <body>
        <img src="images/dressUp_ipad_bg.png" id="frame">
        <img src="images/body_color5.png" id="body">
        <img src="images/clothing_color5.png" id="clothing">
        <img src="images/hair1_color1.png" id="hair">
        <img src="images/dressUp_grass.png" id="grass">
        
            <img src="images/dressUp_tools.png" id="toolsImg">
        <div id="scissors"></div>
        <div id="spray"></div>
        <div id="brush"></div>
        <div id="dryer"></div>
        
        
        <div id="idlePopup">
            <div id="idleBox">
                <h1 id="idleTitle">Press anywhere <br>to continue<br><span id="countdown">5</span></h1>
            </div>
        </div>
        <audio id="burpSound" preload="auto" playsinline>
            <source src="burp.m4a" type="audio/mp4">
        </audio>
    <script>
            let idleTimer;
let countdownTimer;
let countdownValue = 5;

const popup = document.getElementById("idlePopup");
const countdownEl = document.getElementById("countdown");

// Reset everything on activity
function resetIdle() {
    clearTimeout(idleTimer);
    clearInterval(countdownTimer);
    popup.classList.remove("active");
    countdownValue = 10;
    countdownEl.textContent = countdownValue;

    idleTimer = setTimeout(startCountdown, 10000); // 10 seconds idle
}

// Start countdown popup
function startCountdown() {
    popup.classList.add("active");

    countdownTimer = setInterval(() => {
        countdownValue--;
        countdownEl.textContent = countdownValue;

        if (countdownValue <= 0) {
            clearInterval(countdownTimer);
            window.location.href = "unlock.html";
        }
    }, 1000);
}

// Listen for ANY pointer activity
["pointermove", "pointerdown", "touchstart", "click"].forEach(event => {
    document.addEventListener(event, resetIdle);
});

// Initialize
resetIdle();


const hair = document.getElementById("hair");
const scissors = document.getElementById("scissors");

scissors.addEventListener("click", () => {

    // Example current src:
    // images/hair3_color1.png

    const currentSrc = hair.getAttribute("src");

    // Extract current hair number + color number
    const match = currentSrc.match(/hair(\d+)_color(\d+)\.png$/);

    if (!match) return;

    let currentHair = parseInt(match[1]);
    const currentColor = match[2];

    // Cycle 1 → 2 → 3 → 4 → 5 → 1
    currentHair++;

    if (currentHair > 5) {
        currentHair = 1;
    }

    // Keep SAME color
    hair.src = `images/hair${currentHair}_color${currentColor}.png`;
});

const spray = document.getElementById("spray");

spray.addEventListener("click", () => {

    // Example:
    // images/hair3_color2.png

    const currentSrc = hair.getAttribute("src");

    // Extract hair number + color number
    const match = currentSrc.match(/hair(\d+)_color(\d+)\.png$/);

    if (!match) return;

    const currentHair = match[1];
    let currentColor = parseInt(match[2]);

    // Cycle colors
    currentColor++;

    // Change this number if you have more colors
    if (currentColor > 6) {
        currentColor = 1;
    }

    // Keep SAME hair style
    hair.src = `images/hair${currentHair}_color${currentColor}.png`;
});

const body = document.getElementById("body");
const brush = document.getElementById("brush");

brush.addEventListener("click", () => {

    // Example:
    // images/body_color3.png

    const currentSrc = body.getAttribute("src");

    const match = currentSrc.match(/body_color(\d+)\.png$/);

    if (!match) return;

    let currentSkin = parseInt(match[1]);

    // Cycle skins
    currentSkin++;

    // Change max number if needed
    if (currentSkin > 5) {
        currentSkin = 1;
    }

    body.src = `images/body_color${currentSkin}.png`;
});

const clothing = document.getElementById("clothing");
const dryer = document.getElementById("dryer");

dryer.addEventListener("click", () => {

    // Example:
    // images/clothing_color4.png

    const currentSrc = clothing.getAttribute("src");

    const match = currentSrc.match(/clothing_color(\d+)\.png$/);

    if (!match) return;

    let currentClothing = parseInt(match[1]);

    // Cycle clothing
    currentClothing++;

    // Change max number if needed
    if (currentClothing > 5) {
        currentClothing = 1;
    }

    clothing.src = `images/clothing_color${currentClothing}.png`;
});



document.addEventListener("pointerdown", () => {

    const burp = new Audio("burp.m4a");

    burp.playsInline = true;
    burp.volume = 1;

    burp.play().catch(err => {
        console.log(err);
    });

});


    </script>
    </body>
</html>
