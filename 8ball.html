<!DOCTYPE html>
<html>
    <head>
        <style>
            body {
                padding: 0;
                margin: 0;
                overflow: hidden;
                background-color: white;
            }

            h1 {
            font-family: Arial, Helvetica, sans-serif;
            font-size: xx-large;
            color: transparent;
            text-shadow:
                1px 1px 2px aqua,
                0 0 1em blue,
                0 0 0.2em aqua;
            text-align: center;
            z-index: 100;
            padding: 0;
            margin: 0;
        }

        h2 {
            font-family: Arial, Helvetica, sans-serif;
            font-size: x-large;
            color: transparent;
            text-shadow:
                1px 1px 2px white,
                0 0 1em red,
                0 0 1em red,
                0 0 1em red,
                0 0 0.2em white;
            text-align: center;
            z-index: 100;
            padding: 0;
            margin: 0;
        }

        #bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1;
        }

        @keyframes slideLeft {
    from {
        opacity: 0;
        transform: translate(-20px,-50%);
    }
    to {
        opacity: 1;
        transform: translate(0,-50%);
    }
}

@keyframes slideCenter {
    from {
        opacity: 0;
        transform: translate(-50%,calc(-50% + 20px));
    }
    to {
        opacity: 1;
        transform: translate(-50%,-50%);
    }
}

@keyframes slideRight {
    from {
        opacity: 0;
        transform: translate(20px,-50%);
    }
    to {
        opacity: 1;
        transform: translate(0,-50%);
    }
}

@keyframes slideUp {
    from {
        opacity: 0;
        transform: translate(-50%,20px);
    }
    to {
        opacity: 1;
        transform: translate(-50%,0);
    }
}

        #banner {
            background-color: none;
            width: 300px;
            height: 28vh;
            top: 10%;
            left: 15%;
            position: absolute;
            overflow: hidden;
        }

            #cards {
                position: relative;
                top: 5%;
                left: 0%;
                width: 100%;
                height: 30vh;
                z-index: 20;
                background-color: none;
            }

        #tarotCard2 {
            position: absolute;
            z-index: 30;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 5px;
            width: 250px;
            height: 388px;
            background-size: cover;
            background-position: center;
            background-image: url(images/tarotBACK.png);
            box-shadow:
                1px 1px 2px black,
                0 0 1em black,
                0 0 0.2em navy;
            background-color: none;
             opacity:0;
    animation:slideCenter .7s ease forwards;
    animation-delay:.3s;
        }

        #tarotCard1 {
            position: absolute;
             z-index: 30;
            top: 50%;
            left: 5%;
            transform: translateY(-50%);
            border-radius: 5px;
            width: 250px;
            height: 388px;
            background-size: cover;
            background-position: center;
            background-image: url(images/tarotBACK.png);
            box-shadow:
                1px 1px 2px black,
                0 0 1em black,
                0 0 0.2em navy;
            background-color: red;
            opacity:0;
    animation:slideLeft 0.7s ease forwards;
    animation-delay:.15s;
        }

        #tarotCard3 {
            position: absolute;
             z-index: 30;
            top: 50%;
            right: 5%;
            transform: translateY(-50%);
            border-radius: 5px;
            width: 250px;
            height: 388px;
            background-size: cover;
            background-position: center;
            background-image: url(images/tarotBACK.png);
            box-shadow:
                1px 1px 2px black,
                0 0 1em black,
                0 0 0.2em navy;
            background-color: red;
            opacity:0;
    animation:slideRight .7s ease forwards;
    animation-delay:.45s;
        }

        #selection {
            position: absolute;
             z-index: 30;
            top: 120%;
            left: 50%;
            transform: translateX(-50%);
            border-radius: 5px;
            width: 490px;
            height: 760px;
            background-color: red;
            box-shadow:
                1px 1px 2px black,
                0 0 1em black,
                0 0 0.2em navy;
            background-size: cover;
            background-position: center;
            opacity:0;
    animation:slideUp .8s ease forwards;
    animation-delay:.65s;
            overflow: hidden;
        }

        #selectionText {
            position: absolute;
            z-index: 30;
            top: 180%;      /* roughly 5% below #selection */
            left: 50%;
            transform: translateX(-50%);
            width: 250px;
            animation:slideCenter .7s ease forwards;
        }

        #answer {
            position: absolute;
            z-index: 30;
            top: 255%; 
            left: 50%;
            transform: translateX(-50%);
            height: 25%;
            width: 80%;
            background-color: none;
        }
            
        #adbottom {
                position: absolute;
                 z-index: 30;
                bottom: 1%;
                left: 0%;
                width: 100vw;
                height: 200px;
                background-image: url(images/adBOTTOM4.png);
            background-size: cover;
            overflow: hidden;
            }

        </style>
    </head>
<body>
<div id="cards">
    <div id="tarotCard1"></div>
    <div id="tarotCard2"></div>
    <div id="tarotCard3"></div>
    <div id="selection"></div>
    <div id="selectionText"><h1>Think of a question.</h1></div>
    <div id="answer"><h2></h2></div>
</div>
<img src="images/page3_shopping_bg.png" id="bg">
<div id="adbottom"><div id="banner">
    <h1><span id="counter"></span> days since <br>we last spoke.</h1></div>
    </div>
<script>
    function updateCounter() {
    const targetDate = new Date('2026-05-09');
    const today = new Date();

    const diffTime = today - targetDate;
    const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));

    document.getElementById('counter').innerText = diffDays;
}

const tarotMessages = {

3:"Out of your comfort zone. Answer is maybe not.",
4:"Change, metamorphosis. Answer is not yet.",
5:"Beauty, desperation. Answer is let it go.",
6:"Vulnerable, tiny. Consult the wheel.",
7:"Secret love, hidden thoughts. Answer is no.",
8:"Dancer, Prince and George Michael. Maybe?",
9:"Grease, filth, magic. The answer is try again.",

12:"Suffocation, no breathing.",
13:"Mirror image, overwhelmed. Ask again.",

15:"Fetish, guilt. Go sleep first, then ask again.",
16:"Empty, dreamland. The answer is no.",
17:"Playing, mud, moth. The answer is not yet.",
18:"Witch, angel, the interwebs. The answer is yes.",
19:"Night time, cozy, hormonal fluctuation. Maybe.",
20:"Half-and-half, the border. I'm not sure.",
21:"Treasure, summer, Mexico. Outlook good.",
22:"Phone call, hearing loss, Bladee. Check again.",
23:"Knockoff, hiding in your womb. Answer is never.",
24:"Stomach ache, deep breathing. Answer is yes.",
25:"Greed, or drive? You decide. Check again later.",
26:"Arcade games and fudge. Don't do it.",
27:"Pasta and butter. I think the answer is no.",

29:"Time to exercise! You can't know the answer.",
30:"Dysphoria, boobs. Wait three months.",
31:"China, cozy, warts on your feet. Maybe.",
32:"Treasure, summer, Mexico. Outlook good.",
33:"Paranoia, don't feed your ego. Outlook good.",
34:"You're stringing me along! Bad outlook. BAD!",
35:"Finality, the end. There is no coming back. Never.",
36:"Maturity, the big party. All around, positive!",
37:"Hug me! Won't you? The answer is YES.",
38:"Come on! YES, YES, YES, YES!",
39:"Not sure about this one. Sorry."
};

function assignTarotCards() {

    // Create numbers 1-39
    let deck = [];
    for (let i = 1; i <= 39; i++) {
        deck.push(i);
    }

    // Shuffle
    deck.sort(() => Math.random() - 0.5);

    // Assign first three cards
    const ids = ["tarotCard1", "tarotCard2", "tarotCard3"];

    ids.forEach((id, index) => {
        const number = deck[index];
        const filename = `images/tarot_${String(number).padStart(2, "0")}.png`;

        const card = document.getElementById(id);

        // Store data
        card.dataset.number = number;
        card.dataset.image = filename;

        // Click event
       card.onclick = function () {

    document.getElementById("selection").style.backgroundImage =
        `url("${this.dataset.image}")`;

    document.getElementById("selectionText").style.zIndex = "0";

    document.querySelector("#answer h2").textContent =
        tarotMessages[this.dataset.number];
};
    });
}

window.onload = function () {
    updateCounter();
    assignTarotCards();
};
</script>
</body>
</html>
