<!DOCTYPE html>
<html>
    <head>
        <style>
            html, body {
                margin: 0;
                overflow: hidden;
                padding: 0;
            }

            #ig {
                position: absolute;
                z-index: 40;
                width: 20%;
                height: auto;
                right: 10%;
                top: 85%;
                animation: fade 1s;
            }

            #back {
                position: absolute;
                z-index: 40;
                width: 20%;
                height: auto;
                left: 10%;
                top: 85%;
                animation: fade 2s;
            }

            #text {
                position: absolute;
                z-index: 2;
                width: 50%;
                height: auto;
                top: 20%;
                left: 50%;
                transform: translateX(-50%);
                animation: fade 1s;
            }

            @keyframes fade {
                from { opacity: 0%; }
                to   { opacity: 100%; }
            }
            
            #bg {
                position: absolute;
                z-index: 0;
                width: auto;
                height: 100%;
                top: 0;
                left: 50%;
                transform: translateX(-50%);
            }
        </style>
    </head>
    <body>
        <a href="https://www.instagram.com/pao.la.silva/">
            <img src="images/About_ig_btn.png" id="ig">
        </a>
        <a href="page2.html">
            <img src="images/About_back_btn.png" id="back">
        </a>
        <img src="images/about_text.png" id="text">
        <img src="images/About_bg.png" id="bg">
    </body>
</html>
