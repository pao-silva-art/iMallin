<!DOCTYPE html>
<html>
    <head>
         <link rel="icon" type="image/x-icon" href="favicon.ico">
        <style>
            html, body {
                margin: 0;
                overflow: hidden;
                padding: 0;
            }

            #insert {
                position: absolute;
                z-index: 10;
                width: 60%;
                height: auto;
                top: 1%;
                left: 50%;
                transform: translateX(-50%);
                animation: scale 1s;
            }

            #ig {
                position: absolute;
                z-index: 40;
                width: 20%;
                height: auto;
                right: 10%;
                top: 85%;
                animation: fade 1s;
            }

            #back {
                position: absolute;
                z-index: 40;
                width: 20%;
                height: auto;
                left: 10%;
                top: 85%;
                animation: fade 2s;
            }

            #text {
                position: absolute;
                z-index: 2;
                width: 50%;
                height: auto;
                top: 33%;
                left: 50%;
                transform: translateX(-50%);
                animation: fade 1s;
            }

            @keyframes fade {
                from { opacity: 0%; }
                to   { opacity: 100%; }
            }

            @keyframes scale {
                from { width: 0%; }
                to   { width: 60%; }
            }
            
            #bg {
                position: absolute;
                z-index: 0;
                width: auto;
                height: 100%;
                top: 0;
                left: 50%;
                transform: translateX(-50%);
            }
        </style>
    </head>
    <body>
        <img src="images/About_insert.png" id="insert">
        <a href="https://www.instagram.com/pao.la.silva/">
            <img src="images/About_ig_btn.png" id="ig">
        </a>
        <a href="page2.html">
            <img src="images/About_back_btn.png" id="back">
        </a>
        <img src="images/about_text2.png" id="text">
        <img src="images/About_bg.png" id="bg">
    </body>
</html>
