<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Fullscreen Video</title>

<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: black;
}

video {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  object-fit: cover;
}

      #audioPopup {
    position: fixed;
    z-index: 100000;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(0,0,0,0.6);
    display: flex;
    justify-content: center;
    align-items: center;
}

#audioPopup.hidden {
    display: none;
}

#audioBox {
    background-image: linear-gradient(to bottom, red, yellow);
    padding: 30px;
    border-radius: 20px;
    text-align: center;
    animation: pulse 1.5s infinite;
}

#audioTitle {
    font-family: Arial, Helvetica, sans-serif;
    color: white;
    font-size: 8vw;
    text-shadow:
        0 0 5px blue,
        0 0 10px blue,
        0 0 20px blue,
        0 0 40px blue;
}

@keyframes pulse {
    0%   { transform: scale(1); }
    50%  { transform: scale(1.05); }
    100% { transform: scale(1); }
}

#startBtn {
  position: absolute;
  z-index: 100;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  padding: 16px 24px;
  font-size: 20px;
}
</style>
</head>

<body>

<button id="startBtn">Tap to Start</button>

<div id="audioPopup" class="active">
  <div id="audioBox">
    <h1 id="audioTitle">
      tap anywhere<br>
      for sound
    </h1>
  </div>
</div>
      
<video
  id="video"
  playsinline
  webkit-playsinline
  preload="auto"
>
  <source src="video/cloudsfinale_v1.mp4" type="video/mp4" />
</video>

<script>
const video = document.getElementById('video');
const btn = document.getElementById('startBtn');

btn.addEventListener('click', async () => {
  try {
    video.muted = false;
    await video.play();
    btn.style.display = 'none';
  } catch(err) {
    console.log(err);
  }
});

<script>
const video = document.getElementById("video");
const popup = document.getElementById("audioPopup");

document.addEventListener("pointerdown", async () => {
    if (!popup.classList.contains("hidden")) {

        try {
            video.muted = false;
            await video.play();

            popup.classList.add("hidden");

        } catch(err) {
            console.log(err);
        }

    }
}, { once: true });
</script>
      
</script>

</body>
</html>
