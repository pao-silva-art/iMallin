<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
/>

<title>Fullscreen Video</title>

<style>

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: black;
}

body {
    position: fixed;
    inset: 0;
}

/* FULLSCREEN VIDEO */

video {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    object-fit: cover;
    object-position: center center;
    background: black;
    z-index: 1;
}

/* AUDIO POPUP */

#audioPopup {
    position: fixed;
    z-index: 100000;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;

    background: rgba(0,0,0,0.6);

    display: flex;
    justify-content: center;
    align-items: center;
}

#audioPopup.hidden {
    display: none;
}

#audioBox {
    background-image: linear-gradient(to bottom, red, yellow);

    padding: 30px;

    border-radius: 20px;

    text-align: center;

    animation: pulse 1.5s infinite;
}

#audioTitle {

    font-family: Arial, Helvetica, sans-serif;

    color: white;

    font-size: 8vw;

    text-shadow:
        0 0 5px blue,
        0 0 10px blue,
        0 0 20px blue,
        0 0 40px blue;
}

/* OPTIONAL BACK BUTTON */

#back {
    z-index: 20;
    width: 18%;
    height: auto;
    position: absolute;
    left: 6%;
    top: 80%;
}

/* PULSE ANIMATION */

@keyframes pulse {

    0% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.05);
    }

    100% {
        transform: scale(1);
    }
}

/* iPHONE SAFE AREA */

@supports (padding: max(0px)) {

    body {

        padding:
            env(safe-area-inset-top)
            env(safe-area-inset-right)
            env(safe-area-inset-bottom)
            env(safe-area-inset-left);
    }
}

</style>
</head>

<body>

<!-- BACK BUTTON -->

<a href="page2.html">
    <img src="images/dressUp_back.png" id="back">
</a>

<!-- AUDIO POPUP -->

<div id="audioPopup">

    <div id="audioBox">

        <h1 id="audioTitle">
            tap anywhere<br>
            for sound
        </h1>

    </div>

</div>

<!-- VIDEO -->

<video
    id="video"
    playsinline
    webkit-playsinline
    preload="auto"
>
    <source
        src="video/cloudsfinale_v1.mp4"
        type="video/mp4"
    />
</video>

<script>

const video = document.getElementById("video");

const popup = document.getElementById("audioPopup");

/* START VIDEO ON FIRST TAP */

document.addEventListener("pointerdown", async () => {

    try {

        await video.play();

        popup.classList.add("hidden");

    }

    catch(err) {

        console.log(err);

    }

}, { once: true });

</script>

</body>
</html>
