<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Fullscreen Video</title>

<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: black;
}

video {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  object-fit: cover;
}

#startBtn {
  position: absolute;
  z-index: 100;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  padding: 16px 24px;
  font-size: 20px;
}
</style>
</head>

<body>

<button id="startBtn">Tap to Start</button>

<video
  id="video"
  playsinline
  webkit-playsinline
  preload="auto"
>
  <source src="video/cloudsfinale_v1.mp4" type="video/mp4" />
</video>

<script>
const video = document.getElementById('video');
const btn = document.getElementById('startBtn');

btn.addEventListener('click', async () => {
  try {
    video.muted = false;
    await video.play();
    btn.style.display = 'none';
  } catch(err) {
    console.log(err);
  }
});
</script>

</body>
</html>
