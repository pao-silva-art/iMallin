<!DOCTYPE html>
<html>
<head>
<style>
body {
    margin: 0;
    padding: 0;
    overflow: hidden;
}

#vignette {
                left: 50%;
                top: 50%;
                transform: translate(-50%,-50%);
                position: absolute;
                pointer-events: none;
                height: 100%;
                z-index: 100;
            }

    .stretch {
                height: auto;
                width: 100%;
            }

/* Animated background */
#bg {
    position: absolute;
    width: 100%;
    height: 100%;
    z-index: 1;

    background: linear-gradient(
        180deg,
        #00ff48 0%,
        #ff00d4 50%,
        #0048ff 100%
    );

    background-size: 100% 300%;
    animation: gradientMove 3s ease-in-out infinite alternate;
}

/* FEATURE IMAGE */
#feature {
    position: absolute;
    z-index: 20;
    width: 160%;
    height: auto;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0);
    transform-origin: center center;
}

/* scale 0 → 0.8 */
@keyframes featurePop {
    from {
        transform: translate(-50%, -50%) scale(0);
    }
    to {
        transform: translate(-50%, -50%) scale(0.7);
    }
}

.featureAnimate {
    animation: featurePop 0.7s ease-out forwards;
}

/* background animation */
@keyframes gradientMove {
    from {
        background-position: center top;
    }
    to {
        background-position: center bottom;
    }
}

/* TOP BANNER */
#bannerTop {
    position: absolute;
    top: 7%;
    width: 100%;
    height: 10%;
    background-color: red;
    overflow: hidden;
    z-index: 8;
}

#bannerBottom {
    position: absolute;
    bottom: 7%;
    width: 100%;
    height: 10%;
    background-color: red;
    overflow: hidden;
    z-index: 8;
}

/* scrolling tracks */
.track,
.trackBottom {
    display: flex;
    align-items: center;
    height: 100%;
    width: max-content;
}

.track {
    animation: scrollLeft 15s linear infinite;
}

.trackBottom {
    animation: scrollRight 15s linear infinite;
}

.track img,
.trackBottom img {
    width: 25vw;
    height: auto;
    flex-shrink: 0;
    margin-right: 5vw;
}

@keyframes scrollLeft {
    from {
        transform: translateX(0);
    }
    to {
        transform: translateX(-50%);
    }
}

@keyframes scrollRight {
    from {
        transform: translateX(-50%);
    }
    to {
        transform: translateX(0);
    }
}
</style>
</head>

<body>
