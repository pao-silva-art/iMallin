<!DOCTYPE html>
<html>
    <head>
        <style>
            html,body{
                margin: 0;
                padding: 0;
                overflow: hidden;
                background-color: black;
                font-family: "Arial Rounded MT Bold";
                color: aliceblue;
                text-shadow: 0px 0px 2dvh blue, 0px 0px 1dvh blue, 0px 0px 7dvh blue;
                height: 100%;
                position: fixed;
                width: 100%;
                font-size: 5dvh;
                background-image: linear-gradient(to bottom, hotpink, cyan);
                animation: pulse 2s backwards infinite;
            animation-timing-function: linear;
            }

            #instruction01 {
            position: absolute;
            z-index: 20;
            height: 28%;
            transform: translateX(-50%);
            bottom: 3%;
            left: 50%;
        }

        #instruction02 {
            position: absolute;
            z-index: 20;
            height: 28%;
            top: 16%;
            left: 3%;
            transform: rotateX(180deg);
        }

        #instruction03 {
            position: absolute;
            z-index: 20;
            height: 28%;
            top: 16%;
            right: 3%;
            transform: rotateX(180deg);
        }

            #vignette {
                left: 0%;
                top: 0%;
                position: sticky;
                pointer-events: none;
                height: 100%;
                z-index: 100;
            }

            .stretch {
                height: auto;
                width: 100%;
            }

           @font-face {
                font-family: "Arial Rounded MT Bold";
                src: url("fonts/ARLRDBD.TTF") format("truetype");
            }

            @font-face {
                font-family: "Curlz MT Regular";
                src: url("fonts/CURLZ___.TTF") format("truetype");
                font-weight: normal;
                font-style: normal;
            }
            
            @font-face {
                font-family: "Jokerman";
                src: url("fonts/JOKERMAN.TTF") format("truetype");
                font-weight: normal;
                font-style: normal;
            }

        #bg {
            position: absolute;
            top: 0%;
            left: 0%;
            width: 100%;
            z-index: 2;
        }

        @keyframes pulse {
                0% { filter: hue-rotate(0deg); }
                50%   {  filter: hue-rotate(360deg); }
                100% {  filter: hue-rotate(0deg); }
        }    
        
        #wand1 {
            position: absolute;
            z-index: 20;
            height: 100%;
            left: 50%;
            top: -6%;
            transform: translateX(-50%);
             animation: Dpulse 1s backwards infinite;
            animation-timing-function: linear;
        }

        .car {
          position: absolute;
            width: 20%;
            z-index: 30; 
            filter: drop-shadow(-1px 2px 10px blue); 
            animation: shadowB 2s backwards infinite;
            cursor: pointer;
            animation-timing-function: linear;
            transition: filter 0.5s ease;
        }

        .car.blurred { 
            filter: blur(0.5rem) !important; 
        }

        #a {
            top: 50%;
            left: 55%;
            animation: orbit 2s backwards infinite;
            animation-timing-function: linear;
        }

        #b {
            top: 50%;
            right: 55%;
            animation: orbit 1s forwards infinite;
            animation-timing-function: linear;
        }

        #c {
            top: 65%;
            right: 20%;
            animation: orbit 3s forwards infinite;
            animation-timing-function: linear;
        }

        #d {
            top: 65%;
            left: 20%;
            animation: orbit 0.5s backwards infinite;
            animation-timing-function: linear;
        }

        @keyframes orbit {
                from {  -webkit-transform: rotate(0deg) translateX(20px) rotate(0deg); }
                to   {  -webkit-transform: rotate(360deg) translateX(20px) rotate(-360deg); }
        }
        
        @keyframes Dpulse {
                0% { transform: translatex(-50%) scale(1); }
                50%   {  transform: translatex(-50%) scale(1.02); }
                100% {  transform: translatex(-50%) scale(1); }
        }

        @keyframes shadowB {
                0% { filter: drop-shadow(-1px 2px 10px blue);  }
                50%   {  filter: drop-shadow(-1px 2px 15px blue);  }
                75%   {  filter: drop-shadow(-1px 2px 5px blue);  }
                100% {  filter: drop-shadow(-1px 2px 10px blue);  }
        }

        #supernova {
            position: absolute;
            z-index: 18;
            height: 100%;
            left: 50%;
            top: 50%;
            transform: translate(-50%,-50%);
        }

        #diseases {
            font-family: Jokerman;
            color: greenyellow;
            font-size: 5dvh;
            animation: pulse 2s backwards infinite;
            animation-timing-function: linear;
            cursor: pointer;
        }

        #textContainer {
        position: absolute;
        text-align: center;
        top: 1%;
        left: 50%;
        transform: translateX(-50%);
        width: 60%;
        max-width: 800px;
         /* slightly smaller helps too */
        z-index: 10;
        }

        </style>
    </head>
<body>
    <img src="images/vignette.png" id="vignette" class="stretch">
    <a href="statement.html">
        <img src="images/gem01.png" class="car" id="a">
    </a>
    <a href="statement.html">
        <img src="images/gem02.png" class="car" id="b">
     </a>
    <a href="statement.html">
        <img src="images/gem03.png" class="car" id="c">
     </a>
    <a href="statement.html">
        <img src="images/gem04.png" class="car" id="d">
     </a>
    <img src="images/wand.png" id="wand1">
    <img src="images/supernova.png" id="supernova">
    <img src="images/pre-fortune-BG.png" id="bg">
    <img src="images/finalQ.png" id="instruction01">
    <a href="greenEnding.html">
    <img src="images/disease02-L.png" id="instruction02">
    </a>
    <a href="ending-no.html">
        <img src="images/disease03-L.png" id="instruction03">
    </a>
</body>
</html>
