<!DOCTYPE html>
<head>
    <style>
        
         body{
                margin: 0;
                padding: 0;
                overflow: hidden;
            }

        .stretch {
                height: auto;
                width: 100%;
            }

        #divider{
                position: absolute;
                height: 100%;
                z-index: 2;
            }


        #box{
                position: absolute;
                height: 100%;
                display: block;
                /* z-index: 30; */
                z-index: 0;
            }

        #girl{
                position: absolute;
                height: 35%;
                top: 7%;
                left: 50%;
                transform: translateX(-50%);
                z-index: 9;
            }

        .droptarget {
            width: auto;
            height: 100%;
            top: 7%;
            left: 50%;
            transform: translateX(-50%);
            position: relative;
            z-index: 9;
            background-color: rgba(59, 59, 187, 0.5);
        }

        #orb{
            position: absolute;
            height: 27%;
            left: 50%;
            transform: translateX(-50%);
            bottom: 9%;
            z-index: 11;
        }

        #compact{
                position: absolute;
                height: 92%;
                left: 50%;
                transform: translateX(-50%);
                top: 0%;
                z-index: 9;
        }

        #compactContainer{
                position: absolute;
                height: 50vh;
                width: 100%;
                left: 0%;
                bottom: 0%;
                z-index: 9;
                background-color: none;
        }


        #bg{
                position: absolute;
                height: 100%;
                z-index: 1;
            }
    </style>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <img src="images/story_dialog_Box.png" id="box">
    <div id="compactContainer">
        <img src="images/story_compact2.png" id="compact">
        <img src="images/story_orb.png" id="orb" ondragstart="dragStart(event)" ondrag="dragging(event)" draggable="true">
    </div>
    <img src="images/story_divider.png" id="divider">
    <img src="images/story_girl2.png" id="girl" class="droptarget" ondrop="drop(event)" ondragover="allowDrop(event)">
    <img src="images/story_bg.png" id="bg" class="stretch">
<script>
    const orb = document.getElementById('orb');
    const girl = document.getElementById('girl');
    const sound = new Audio ('burp.m4a');

    // Track original positions relative to its starting layout
    let startX = 0;
    let startY = 0;

    // --- DESKTOP DRAG & DROP API ---
    function dragStart(event) {
        event.dataTransfer.setData("text/plain", event.target.id);
    }

    function allowDrop(event) {
        event.preventDefault();
    }

    function drop(event) {
        event.preventDefault();
        const data = event.dataTransfer.getData("text/plain");
        if (data === "orb") {
            successAction();
        }
    }

    // --- MOBILE TOUCH EVENTS API ---
    function handleTouchStart(event) {
        // Disable transitions while actively dragging
        orb.style.transition = 'none';
        
        // Save base coordinates on first touch
        if (startX === 0 && startY === 0) {
            const rect = orb.getBoundingClientRect();
            startX = rect.left;
            startY = rect.top;
        }
    }

    function handleTouchMove(event) {
        event.preventDefault(); // Prevents page scrolling while dragging
        const touch = event.touches[0];

        // Move the orb dynamically based on touch viewport tracking
        // Center the orb on the user's fingertip using half offsets
        orb.style.position = 'fixed';
        orb.style.left = (touch.clientX - (orb.offsetWidth / 2)) + 'px';
        orb.style.top = (touch.clientY - (orb.offsetHeight / 2)) + 'px';
        orb.style.bottom = 'auto'; 
        orb.style.transform = 'none'; // Clear translate rules causing displacement
    }

    function handleTouchEnd(event) {
        // Find element at touch release point
        const touch = event.changedTouches[0];
        const elementAtPoint = document.elementFromPoint(touch.clientX, touch.clientY);

        // Check if the drop target was the girl graphic
        if (elementAtPoint === girl) {
            successAction();
        } else {
            resetOrbPosition();
        }
    }

    // --- SHARED HELPER FUNCTIONS ---
    function successAction() {
        console.log("Success! Orb given to the girl.");
        girl.style.filter = "brightness(1.4)";
        sound.play();
        // Add additional win condition logic or scene triggers here
    }

    function resetOrbPosition() {
        // Add a smooth transition back to base coordinates
        orb.style.transition = 'all 0.4s ease-out';
        orb.style.position = 'fixed';
        orb.style.left = startX + 'px';
        orb.style.top = startY + 'px';
    }
    
</script>
</body>
</html>
