<!DOCTYPE html>
<head>
    <style>
        
         body{
                margin: 0;
                padding: 0;
                overflow: hidden;
            }

        h1 {
            font-family: Arial, Helvetica, sans-serif;
            font-size: xx-large;
            color: transparent;
            text-shadow:
                1px 1px 2px white,
                0 0 1em blue,
                0 0 0.2em white;
            text-align: center;
            z-index: 100;
            padding: 0;
            margin: 0;
        }

       #text {
    position: absolute;
    top: 30%;
    left: 0;
    width: 100%;
    overflow: hidden;
    white-space: nowrap;
    z-index: 10;
    pointer-events: none;
}

#ticker {
    display: inline-block;
    white-space: nowrap;
    padding-left: 100vw;
    animation: newsTicker 30s linear forwards;
}

@keyframes newsTicker {
    from {
        transform: translateX(0);
    }
    to {
        transform: translateX(-100%);
    }
}
        #instruction {
            position: absolute;
            top: 91%;
            left: 0%;
            width: 100%;
            height: 7%;
            z-index: 0;
            animation: pulseGlow 2s ease-in-out infinite;
        }

        @keyframes pulseGlow {
    0%, 100% {
        text-shadow:
            1px 1px 2px rgba(255,255,255,0.8),
            0 0 8px rgba(0,100,255,0.6),
            0 0 2px rgba(255,255,255,0.8);
    }

    50% {
        text-shadow:
            1px 1px 4px rgba(255,255,255,1),
            0 0 24px rgba(0,120,255,1),
            0 0 10px rgba(255,255,255,1);
    }
}

        #dialogue {
            position: absolute;
            top: 80%;
            left: 0%;
            width: 100%;
            height: 7%;
            z-index: 10;
            display: table;
        }

        .stretch {
                height: auto;
                width: 100%;
            }

        #divider{
                position: absolute;
                height: 100%;
                z-index: 2;
            }


        #box{
                position: absolute;
                width: 100%;
                height: 160%;
                display: block;
                top: 0;
                left: 0;
                /* z-index: 30; */
                z-index: 9;
            }

        #girl{
                position: absolute;
                height: 35%;
                top: 7%;
                left: 50%;
                transform: translateX(-50%);
                z-index: 9;
            }

        .droptarget {
            width: auto;
            height: 100%;
            top: 7%;
            left: 50%;
            transform: translateX(-50%);
            position: relative;
            z-index: 9;
            background-color: none;
        }

        #orb{
            position: absolute;
            height: 27%;
            left: 50%;
            transform: translateX(-50%);
            bottom: 9%;
            z-index: 11;
        }

        #compact{
                position: absolute;
                height: 92%;
                left: 50%;
                transform: translateX(-50%);
                top: 0%;
                z-index: 9;
        }

        #compactContainer{
                position: absolute;
                height: 50vh;
                width: 100%;
                left: 0%;
                bottom: 0%;
                z-index: 9;
                background-color: none;
        }


        #bg{
                position: absolute;
                height: 100%;
                z-index: 1;
            }
    </style>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <h1 id="instruction">feed her orbs.</h1>
    <div id="dialogue">
        <div id="text"><h1 id=ticker>
            i'm from tijuana, but i want to live at The Mall...
            if i buy enough build-a-bears...
            and if i learn english well enough...
            maybe then i can be a Citizen of the Mall.</h1></div>
    <img src="images/story_dialog_Box.png" id="box">
    </div>
    <div id="compactContainer">
        <img src="images/story_compact2.png" id="compact">
        <img src="images/story_orb.png" id="orb" ondragstart="dragStart(event)" ondrag="dragging(event)" draggable="true">
    </div>
    <img src="images/story_divider.png" id="divider">
    <img src="images/story_girl2.png" id="girl" class="droptarget" ondrop="drop(event)" ondragover="allowDrop(event)">
    <img src="images/story_bg.png" id="bg" class="stretch">
<script>
       const orb = document.getElementById('orb');
    const girl = document.getElementById('girl');
    const sound = new Audio ('burp.m4a');

    // Track original positions relative to its starting layout
    let startX = 0;
    let startY = 0;

    // Track the current brightness level (1.0 = 100% normal brightness)
    let currentBrightness = 1.0; 
    const brightnessIncrement = 0.2; // Amount to increase linearly each time

    // --- DESKTOP DRAG & DROP API ---
    function dragStart(event) {
        event.dataTransfer.setData("text/plain", event.target.id);
    }

    function allowDrop(event) {
        event.preventDefault();
    }

    function drop(event) {
        event.preventDefault();
        const data = event.dataTransfer.getData("text/plain");
        if (data === "orb") {
            successAction();
        }
    }

    // --- MOBILE TOUCH EVENTS API ---
    function handleTouchStart(event) {
        orb.style.transition = 'none';
        if (startX === 0 && startY === 0) {
            const rect = orb.getBoundingClientRect();
            startX = rect.left;
            startY = rect.top;
        }
    }

    function handleTouchMove(event) {
        event.preventDefault();
        const touch = event.touches[0];
        orb.style.position = 'fixed';
        orb.style.left = (touch.clientX - (orb.offsetWidth / 2)) + 'px';
        orb.style.top = (touch.clientY - (orb.offsetHeight / 2)) + 'px';
        orb.style.bottom = 'auto'; 
        orb.style.transform = 'none';
    }

    function handleTouchEnd(event) {
        const touch = event.changedTouches[0];
        const elementAtPoint = document.elementFromPoint(touch.clientX, touch.clientY);
        if (elementAtPoint === girl) {
            successAction();
        } else {
            resetOrbPosition();
        }
    }

    // --- SHARED HELPER FUNCTIONS ---
    function successAction() {
        console.log("Success! Orb given to the girl.");
        
        // 1. Linearly increment the tracked brightness value
        currentBrightness += brightnessIncrement;
        
        // 2. Apply the dynamic value back to the CSS filter
        girl.style.filter = `brightness(${currentBrightness})`;
        
        sound.play();
    }

    function resetOrbPosition() {
        orb.style.transition = 'all 0.4s ease-out';
        orb.style.position = 'fixed';
        orb.style.left = startX + 'px';
        orb.style.top = startY + 'px';
    }

const ticker = document.getElementById("ticker");
const dialogue = document.getElementById("dialogue");

ticker.addEventListener("animationend", () => {
    dialogue.style.zIndex = "0";
    document.getElementById("instruction").style.zIndex = "14";
    dialogue.querySelectorAll("*").forEach(el => {
        el.style.zIndex = "0";
    });
});
    
</script>
</body>
</html>
